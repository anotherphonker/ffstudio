[package]
name = "core"
version = "0.1.0"
edition = "2021"
description = "FF Studio cekirdek mantigi (GUI + TUI ortak)"

# Rust'in yerlesik `core` crate'i ile karismasin diye kutuphane adi farkli:
[lib]
name = "ffstudio_core"
path = "src/lib.rs"

[features]
# ffmpeg.zip'i binary icine gomme yetenegi.
#   - GUI acar  : gui/Cargo.toml -> features = ["embed-ffmpeg"]
#   - TUI ACMAZ : Termux'ta ffmpeg PATH'ten gelir, zip hic aranmaz
# Yani TUI'yi derlerken ffmpeg.zip olmasa da hicbir sey bozulmaz.
embed-ffmpeg = ["dep:zip"]
# Test yardimcilari (yalnizca dev-dependency olarak acilir)
testutil = []

[dependencies]
serde_json = "1"
anyhow = "1"
dirs = "5"
zip = { version = "0.6.6", optional = true, default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# ffmpeg cocuk sureclerine SIGTERM yollamak icin (orphan process kalmasin)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry"] }
