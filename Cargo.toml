[package]
name = "ffstudio"
version = "0.1.0"
edition = "2021"

# Uygulama kodu lib'de (bin + headless testler ayni koddan).
[lib]
name = "ffstudio"
crate-type = ["rlib"]

[dependencies]
eframe = "=0.28.1"
serde_json = "1"
dirs = "5"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# Masaustu dosya secici (coklu dosya + klasor)
rfd = "0.14"

[build-dependencies]
# Windows exe ikonu + surum bilgisi (Gezgin/taskbar) gomme
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
