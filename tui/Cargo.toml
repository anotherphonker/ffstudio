[package]
name = "tui"
version = "0.1.0"
edition = "2021"
description = "FF Studio Termux TUI istemcisi (ratatui)"

[lib]
name = "ffstudio_tui"
path = "src/lib.rs"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
ffstudio_core = { package = "core", path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Ctrl+C: aktif ffmpeg sureclerini sonlandirip terminali temiz birak
ctrlc = "3"

[dev-dependencies]
ffstudio_core = { package = "core", path = "../core", features = ["testutil"] }
